<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Getijdeklok Scheveningen</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; width: 100%;
    background: radial-gradient(circle at 50% 40%, #1c2b3a 0%, #0b141d 100%);
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    color: #dfe6ec;
    overflow-x: hidden;
    padding: 10px 8px 24px;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
       color: #9fb3c4; margin: 10px 0 6px; text-align: center; }
  #wrap { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 640px; }
  canvas {
    display: block; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.55));
    width: min(92vw, 88vh, 560px);
    height: min(92vw, 88vh, 560px);
    max-width: 100%;
  }
  #controls {
    margin-top: 10px; font-size: 12px; color: #7f93a4;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 420px;
  }
  #controls label { display: flex; gap: 6px; align-items: center; }
  #controls input, #controls select {
    background: #142230; border: 1px solid #2a3d4d; color: #dfe6ec; border-radius: 4px;
    padding: 4px 6px; font-size: 13px; max-width: 44vw;
  }
  #controls button {
    background: #1f3a52; border: 1px solid #2a3d4d; color: #dfe6ec; border-radius: 4px;
    padding: 6px 12px; font-size: 13px;
  }
  #status { margin-top: 8px; font-size: 12px; text-align: center; min-height: 34px; color: #8fa6b8;
             max-width: 92vw; }
  #status.warn { color: #d98c4a; }
  #status.ok { color: #6fbf8b; }
  a { color: #6fa8d8; }

  @media (max-width: 420px) {
    #controls { font-size: 11px; }
    #controls input[type="text"] { width: 38vw; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>Getijdeklok</h1>
  <canvas id="clock" width="640" height="640"></canvas>
  <div id="controls">
    <label>Locatie:
      <input id="locationInput" type="text" value="scheveningen" size="16">
    </label>
    <label>Ververs elke
      <input id="refreshInput" type="number" min="1" value="15" style="width:48px">
      min
    </label>
    <label>
      <input id="proxyToggle" type="checkbox" checked>
      CORS-proxy
    </label>
    <label>Proxy-adres (leeg = automatisch):
      <input id="proxyInput" type="text" value="" placeholder="optioneel eigen proxy" size="20">
    </label>
    <button id="applyBtn">Toepassen</button>
  </div>
  <div id="status">Getijgegevens ophalen&hellip;</div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Getijdeklok Scheveningen -- HTML/Canvas/JavaScript-versie
 *
 * Zelfde principe als de Python-versie:
 *  - zwarte wijzers = gewone tijd (systeemklok van de browser)
 *  - rode wijzer     = getijfase, lineair geinterpoleerd tussen de
 *                       dichtstbijzijnde hoog- en laagwaterextremen
 *                       (RWS-groepering "GETETBRKD2")
 *
 * LET OP - CORS: de RWS WaterWebservices zijn primair bedoeld voor
 * server-naar-server gebruik. Als de RWS-server geen
 * Access-Control-Allow-Origin-header teruggeeft, zal de fetch() hieronder
 * door de browser geblokkeerd worden. In dat geval valt de klok terug op
 * een schatting (gemiddelde getijperiode van 12u25m), net als de
 * Python-versie. Werkt fetch niet vanuit de browser, dan is de
 * eenvoudigste oplossing een klein eigen proxy-scriptje (bv. de
 * meegeleverde Python-versie, of een paar regels Node/PHP) dat de RWS-call
 * server-side doet en het resultaat als JSON teruggeeft aan deze pagina.
 * ------------------------------------------------------------------ */

const BASE_URL = "https://ddapi20-waterwebservices.rijkswaterstaat.nl";
const GETIJ_GROEPERING = "GETETBRKD2";
const AVG_TIDE_PERIOD_MS = (12 * 60 + 25) * 60 * 1000; // 12u25m in ms

// RWS geeft geen Access-Control-Allow-Origin-header terug, dus een rechtstreekse
// fetch() vanuit de browser (ook mobiel Safari) wordt geblokkeerd door CORS.
// Als fallback routeren we het verzoek dan via publieke CORS-proxy's, die de
// RWS-headers wél toevoegen. Dit zijn third-party diensten (niet van RWS of
// Anthropic) die soms zelf ook eens plat liggen -- daarom proberen we er
// hieronder meerdere na elkaar. Werken ze allemaal niet, vul dan zelf een
// ander proxy-adres in bij de instellingen (formaat: alles voor de doel-URL,
// die er met encodeURIComponent() achteraan geplakt wordt).
const DEFAULT_CORS_PROXIES = [
  "https://corsproxy.io/?url=",
  "https://api.allorigins.win/raw?url=",
  "https://thingproxy.freeboard.io/fetch/",
];

let state = {
  location: "scheveningen",
  refreshMinutes: 15,
  useProxy: true,
  proxyPrefix: "",  // leeg = automatisch de lijst hierboven doorlopen
  extremes: [],          // [{t: Date, type: "HW"|"LW"}, ...]
  lastFetch: null,
  isEstimated: true,
  prevExtreme: null,
  nextExtreme: null,
};

/* ---------------------------- Data ophalen --------------------------- */

function isoWithColonOffset(date) {
  // Bouwt "YYYY-MM-DDTHH:MM:SS.000+HH:MM" (RWS wil de dubbele punt in de offset)
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  const off = -date.getTimezoneOffset(); // minuten, positief = ten oosten van UTC
  const sign = off >= 0 ? "+" : "-";
  const oh = pad(Math.floor(Math.abs(off) / 60));
  const om = pad(Math.abs(off) % 60);
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}` +
         `T${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}.000` +
         `${sign}${oh}:${om}`;
}

async function postJson(url, options = {}) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(options.body),
    ...(options.signal ? { signal: options.signal } : {}),
  });
  return resp;
}

function withTimeout(promiseFactory, ms) {
  return Promise.race([
    promiseFactory(),
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
  ]);
}

async function fetchTideExtremes(locationCode, around, hoursBack = 30, hoursForward = 30) {
  const start = new Date(around.getTime() - hoursBack * 3600 * 1000);
  const end = new Date(around.getTime() + hoursForward * 3600 * 1000);

  const body = {
    Locatie: { Code: locationCode },
    AquoPlusWaarnemingMetadata: {
      AquoMetadata: { Groepering: { Code: GETIJ_GROEPERING } },
    },
    Periode: {
      Begindatumtijd: isoWithColonOffset(start),
      Einddatumtijd: isoWithColonOffset(end),
    },
  };
  const url = `${BASE_URL}/ONLINEWAARNEMINGENSERVICES/OphalenWaarnemingen`;

  // Kandidaten om te proberen: eerst rechtstreeks, dan de (eigen of
  // standaard-) proxy's, in volgorde, tot er eentje lukt.
  const candidates = [];
  candidates.push({ label: "rechtstreeks", url });
  if (state.useProxy) {
    const prefixes = state.proxyPrefix ? [state.proxyPrefix] : DEFAULT_CORS_PROXIES;
    for (const prefix of prefixes) {
      candidates.push({ label: `proxy ${prefix}`, url: prefix + encodeURIComponent(url) });
    }
  }

  const errors = [];
  for (const candidate of candidates) {
    try {
      const resp = await withTimeout(() => postJson(candidate.url, { body }), 12000);
      if (resp.status === 204) {
        throw new Error("Geen getijgegevens gevonden voor deze periode/locatie.");
      }
      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}`);
      }
      const data = await resp.json();
      return parseExtremes(data, candidate.label);
    } catch (err) {
      errors.push(`${candidate.label}: ${err.message}`);
    }
  }
  throw new Error(errors.join(" | "));
}

function parseExtremes(data, sourceLabel) {

  // De GETETBRKD2-mux geeft twee gekoppelde lijsten terug (zie de
  // Python-versie voor een uitgebreidere toelichting): een tekstkanaal met
  // Waarde_Alfanumeriek "hoogwater"/"laagwater", en een cijferkanaal (cm
  // t.o.v. NAP) dat we hier niet nodig hebben.
  const TYPE_MAP = { hoogwater: "HW", laagwater: "LW" };
  const extremes = [];
  for (const lijst of data.WaarnemingenLijst || []) {
    for (const meting of lijst.MetingenLijst || []) {
      const waarde = (meting.Meetwaarde || {}).Waarde_Alfanumeriek;
      const type = TYPE_MAP[(waarde || "").trim().toLowerCase()];
      if (!type || !meting.Tijdstip) continue;
      extremes.push({ t: new Date(meting.Tijdstip), type });
    }
  }
  extremes.sort((a, b) => a.t - b.t);
  if (extremes.length === 0) {
    throw new Error("Kon geen HW/LW-typering uit de respons halen.");
  }
  return extremes;
}

async function refreshTideData() {
  const now = new Date();
  try {
    state.extremes = await fetchTideExtremes(state.location, now);
    state.isEstimated = false;
    setStatus(`Getijgegevens ververst voor '${state.location}'.`, "ok");
  } catch (err) {
    state.isEstimated = true;
    setStatus(
      `Kon geen live getijgegevens ophalen (${err.message}). ` +
      `Klok gebruikt een schatting (gemiddelde periode 12u25m). ` +
      `Vaak is dit een CORS-blokkade -- zie de code-comments voor uitleg.`,
      "warn"
    );
  }
  state.lastFetch = now;
}

function setStatus(msg, cls) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = cls || "";
}

/* ------------------------- Getijhoek berekenen ------------------------ */

function surroundingExtremes(now, extremes) {
  let prev = null, next = null;
  for (const e of extremes) {
    if (e.t <= now) prev = e;
    else { next = e; break; }
  }
  return [prev, next];
}

function tideHandAngle(now, extremes) {
  const [prev, next] = surroundingExtremes(now, extremes);

  if (prev && next) {
    const frac = (next.t - prev.t) !== 0 ? (now - prev.t) / (next.t - prev.t) : 0;
    const base = prev.type === "HW" ? 0 : 180;
    return { angle: (base + 180 * frac) % 360, prev, next, estimated: false };
  }

  const ref = prev || next;
  if (!ref) return { angle: 0, prev: null, next: null, estimated: true };
  const elapsed = ((now - ref.t) % AVG_TIDE_PERIOD_MS + AVG_TIDE_PERIOD_MS) % AVG_TIDE_PERIOD_MS;
  const base = ref.type === "HW" ? 0 : 180;
  const angle = (base + 360 * (elapsed / AVG_TIDE_PERIOD_MS)) % 360;
  return { angle, prev, next, estimated: true };
}

/* ------------------------------ Tekenen -------------------------------- */

const TIDE_LABELS = [
  ["HIGH TIDE", 0], ["AFTER HIGH", 45], ["HALF TIDE", 90], ["BEFORE LOW", 135],
  ["LOW TIDE", 180], ["AFTER LOW", 225], ["HALF TIDE", 270], ["BEFORE HIGH", 315],
];

const canvas = document.getElementById("clock");
const ctx = canvas.getContext("2d");
const SIZE = canvas.width;
const CX = SIZE / 2, CY = SIZE / 2;
const R = SIZE * 0.46; // basisstraal van de wijzerplaat (1.0 in genormaliseerde eenheden)

function polar(angleDeg, radiusNorm) {
  const a = (90 - angleDeg) * Math.PI / 180;
  return [CX + radiusNorm * R * Math.cos(a), CY - radiusNorm * R * Math.sin(a)];
}

function drawStaticFace(locationLabel) {
  ctx.save();
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Behuizing
  ctx.beginPath(); ctx.arc(CX, CY, 1.30 * R, 0, 2 * Math.PI);
  ctx.fillStyle = "#141414"; ctx.fill();

  // bevestigingsoren
  ctx.fillStyle = "#141414";
  for (const side of [-1, 1]) {
    const w = 0.10 * R, h = 0.32 * R;
    const x = CX + side * 1.22 * R - w / 2;
    const y = CY - h / 2;
    roundRect(x, y, w, h, 0.05 * R);
    ctx.fill();
  }
  // schroefgaten
  for (const side of [-1, 1]) {
    const [x, y] = polar(180 + side * 35, 1.14);
    ctx.beginPath(); ctx.arc(x, y, 0.045 * R, 0, 2 * Math.PI);
    ctx.fillStyle = "white"; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#333"; ctx.stroke();
  }

  ctx.beginPath(); ctx.arc(CX, CY, 1.14 * R, 0, 2 * Math.PI);
  ctx.fillStyle = "#dcdcdc"; ctx.fill();

  ctx.beginPath(); ctx.arc(CX, CY, 1.08 * R, 0, 2 * Math.PI);
  ctx.fillStyle = "white"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.stroke();

  // Getij-labels
  ctx.fillStyle = "#111"; ctx.font = `bold ${0.032 * R * 2}px Arial`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const [label, ang] of TIDE_LABELS) {
    const [x, y] = polar(ang, 0.98);
    const rot = (ang <= 180 ? -(ang - 90) : -(ang - 90) + 180) * Math.PI / 180;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-rot);
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }

  // Getij-cijferring 0..23
  ctx.font = `${0.022 * R * 2}px Arial`; ctx.fillStyle = "#333";
  for (let i = 0; i < 24; i++) {
    const ang = i * 15; 
    const [x1, y1] = polar(ang, 0.86);
    const [x2, y2] = polar(ang, i % 2 === 0 ? 0.90 : 0.88);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineWidth = i % 6 === 0 ? 1.6 : 0.9;
    ctx.strokeStyle = "#111"; ctx.stroke();
    if (i % 2 === 1) {
      const [tx, ty] = polar(ang, 0.80);
      ctx.fillText(String(i), tx, ty);
    }
  }

  // Gewone tijd: minutenstreepjes
  for (let m = 0; m < 60; m++) {
    const ang = m * 6;
    const [x1, y1] = polar(ang, 0.66);
    const [x2, y2] = polar(ang, m % 5 === 0 ? 0.58 : 0.62);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.lineWidth = m % 5 === 0 ? 2 : 0.8;
    ctx.strokeStyle = "#111"; ctx.stroke();
  }
  // Uurcijfers
  ctx.font = `bold ${0.045 * R * 2}px Arial`; ctx.fillStyle = "#111";
  for (let h = 1; h <= 12; h++) {
    const [x, y] = polar(h * 30, 0.52);
    ctx.fillText(String(h), x, y);
  }

  // Middenlabels
  ctx.fillStyle = "#8a1c1c"; ctx.font = `bold ${0.038 * R * 2}px Arial`;
  ctx.fillText(locationLabel.charAt(0).toUpperCase() + locationLabel.slice(1), CX, CY - 0.28 * R);
  ctx.fillStyle = "#333"; ctx.font = `italic ${0.028 * R * 2}px Arial`;
  ctx.fillText("Tide & Time", CX, CY - 0.20 * R);

  ctx.restore();
}

function drawHand(angleDeg, lengthNorm, width, color, tail = 0.08) {
  const [x0, y0] = polar(angleDeg + 180, lengthNorm * tail);
  const [x1, y1] = polar(angleDeg, lengthNorm);
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.lineWidth = width; ctx.strokeStyle = color; ctx.lineCap = "round";
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function renderFrame() {
  const now = new Date();

  drawStaticFace(state.location);

  const { angle, prev, next, estimated } = tideHandAngle(now, state.extremes);
  state.prevExtreme = prev; state.nextExtreme = next;
  const overallEstimated = state.isEstimated || estimated;

  const hourAngle = ((now.getHours() % 12) + now.getMinutes() / 60 + now.getSeconds() / 3600) * 30;
  const minuteAngle = now.getMinutes() * 6 + now.getSeconds() * 0.1;
  const secondAngle = now.getSeconds() * 6 + now.getMilliseconds() * 0.006;

  drawHand(hourAngle, 0.40, 7, "#111111");
  drawHand(minuteAngle, 0.58, 4.5, "#111111");
  drawHand(secondAngle, 0.64, 1.6, "#555555", 0.12);
  drawHand(angle, 0.78, 3.2, "#b91c1c");

  // as
  ctx.beginPath(); ctx.arc(CX, CY, 0.035 * R, 0, 2 * Math.PI);
  ctx.fillStyle = "#111"; ctx.fill();
  ctx.beginPath(); ctx.arc(CX, CY, 0.016 * R, 0, 2 * Math.PI);
  ctx.fillStyle = "#b91c1c"; ctx.fill();

  // bron-label onder het midden
  ctx.font = `${0.020 * R * 2}px Arial`; ctx.fillStyle = "#666";
  ctx.fillText(overallEstimated ? "geschat (geen livedata)" : "RWS getijverwachting", CX, CY + 0.22 * R);

  // onderschrift
  ctx.font = `${0.028 * R * 2}px Arial`; ctx.fillStyle = "#333";
  const dateStr = now.toLocaleString("nl-NL", {
    weekday: "long", day: "2-digit", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
  ctx.fillText(`${dateStr}  (${state.location})`, CX, SIZE - 0.10 * R);
  if (prev && next) {
    const fmt = (d) => d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    ctx.font = `${0.024 * R * 2}px Arial`;
    ctx.fillText(`${prev.type} om ${fmt(prev.t)}  ->  ${next.type} om ${fmt(next.t)}`, CX, SIZE - 0.045 * R);
  }
}

/* ------------------------------- Main ---------------------------------- */

function tick() {
  renderFrame();
  requestAnimationFrame(tick);
}

async function maybeRefresh() {
  const now = new Date();
  if (!state.lastFetch || (now - state.lastFetch) >= state.refreshMinutes * 60 * 1000) {
    await refreshTideData();
  }
}

function startRefreshLoop() {
  maybeRefresh();
  setInterval(maybeRefresh, 20 * 1000); // check elke 20s of een refresh nodig is
}

document.getElementById("applyBtn").addEventListener("click", () => {
  const loc = document.getElementById("locationInput").value.trim().toLowerCase();
  const mins = parseInt(document.getElementById("refreshInput").value, 10);
  const proxyOn = document.getElementById("proxyToggle").checked;
  const proxyPrefix = document.getElementById("proxyInput").value.trim();
  if (loc) state.location = loc;
  if (!isNaN(mins) && mins > 0) state.refreshMinutes = mins;
  state.useProxy = proxyOn;
  state.proxyPrefix = proxyPrefix; // leeg = automatisch de standaardlijst doorlopen
  state.lastFetch = null; // forceer meteen een nieuwe fetch
  state.extremes = [];
  maybeRefresh();
});

startRefreshLoop();
requestAnimationFrame(tick);
</script>
</body>
</html>
